name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      NEXT_PUBLIC_STACK_PROJECT_ID: ci-project
      NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ci-publishable-key
      STACK_SECRET_SERVER_KEY: ci-secret-key
      PAYSTACK_SECRET_KEY: sk_test_ci
      ORDER_RECEIPT_SECRET: ci-receipt-secret-not-paystack

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
