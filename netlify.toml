[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "BMS_SENDER_ID,NEXT_PUBLIC_PHARMACY_PHONE,NEXT_PUBLIC_POLL_INTERVAL,SUPABASE_PRODUCT_BUCKET,ALLOWED_ORIGINS,DB_IDLE_TIMEOUT_MS,NEXT_PUBLIC_APP_URL,AUTH_URL,DB_CONNECTION_TIMEOUT_MS,NODE_OPTIONS,NEXT_PUBLIC_SUPABASE_URL,APP_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
